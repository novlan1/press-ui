name: Deploy GitHub Pages - Press UI

on:
  push:
    branches:
      - master
  workflow_dispatch:

# 官方 Pages 部署方式：contents 只需 read，pages/id-token 由 deploy-pages 内部使用
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
          fetch-depth: 2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Dependencies
        run: pnpm install

      # 生成静态文件：VuePress 文档 + uni-app H5 demo
      # error:0308010C:digital envelope routines::unsupported 由各脚本内的 NODE_OPTIONS 处理
      - name: Build
        run: npm run init && npm run docs:build && npm run build && cp -r dist/build/h5 docs/.vuepress/dist

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vuepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
